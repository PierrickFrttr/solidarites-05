name: Mise à jour mensuelle
on:
  schedule:
    - cron: "0 8 1 * *"  # le 1er du mois à 8 h UTC
  workflow_dispatch:      # bouton « Run workflow » pour lancer à la main
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python import_05.py
      - name: Enregistrer les nouvelles données (Cloudflare republie le site)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add site/data.js
          git diff --cached --quiet || git commit -m "Données data·inclusion du $(date +%F)" && git push
